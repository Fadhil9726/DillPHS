name: Build Sync XxX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        run: python3 generate_icons.py

      - name: Setup Gradle Wrapper
        run: |
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Find and Rename APK
        run: |
          mkdir -p output
          # 🔥 Cari APK di folder DEBUG
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output/SyncXxX.apk \;
          # Kalau tidak ada di debug, cari di release
          if [ ! -f output/SyncXxX.apk ]; then
            find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/SyncXxX.apk \;
          fi
          echo "📦 APK size:"
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncXxX-APK
          path: output/SyncXxX.apk
          retention-days: 30
